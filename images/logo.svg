<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" aria-label="Gardena Water Line Pros Logo">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Icon Graphic -->
  <g transform="translate(10, 8)">
    <!-- Shield / Badge background -->
    <path d="M26 2 C38 2, 50 8, 50 16 C50 36, 26 50, 26 52 C26 50, 2 36, 2 16 C2 8, 14 2, 26 2 Z" fill="url(#blueGrad)" />
    
    <!-- Water Drop -->
    <path d="M26 12 C26 12, 16 26, 16 32 C16 37.5, 20.5 42, 26 42 C31.5 42, 36 37.5, 36 32 C36 26, 26 12, 26 12 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Inner Water Ripple -->
    <path d="M22 33 C22 29.5, 24 26, 26 23 C28 26, 30 29.5, 30 33 C30 35.2, 28.2 37, 26 37 C23.8 37, 22 35.2, 22 33 Z" fill="url(#accentGrad)"/>
    
    <!-- Pipe Flow Wrench accent -->
    <circle cx="38" cy="14" r="6" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M38 11 L38 17 M35 14 L41 14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <!-- Line 1: GARDENA -->
  <text x="74" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" fill="#0F2C59">GARDENA</text>
  
  <!-- Line 2: WATER LINE PROS -->
  <text x="74" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5" fill="#0284C7">WATER LINE PROS</text>
  
  <!-- Sub-label: LOCAL DISPATCH REFERRAL -->
  <text x="74" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" fill="#64748B">SOUTH BAY PIPE REPAIR &amp; REPLACEMENT</text>
</svg>
