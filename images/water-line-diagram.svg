<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" aria-label="Gardena Water Service Line Responsibility Diagram">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Sky & Ground Background -->
  <rect x="0" y="0" width="800" height="240" fill="url(#skyGrad)"/>
  <rect x="0" y="240" width="800" height="180" fill="url(#soilGrad)"/>
  <rect x="0" y="235" width="800" height="15" fill="url(#grassGrad)"/>

  <!-- Street & Curb on Left -->
  <rect x="0" y="225" width="180" height="25" fill="#64748B"/>
  <rect x="0" y="222" width="180" height="3" fill="#94A3B8"/>
  <text x="70" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">STREET / CURB</text>

  <!-- Water Meter Pit Box -->
  <rect x="180" y="210" width="70" height="50" fill="#334155" rx="3"/>
  <rect x="185" y="215" width="60" height="40" fill="#1E293B"/>
  <!-- Meter Dial -->
  <circle cx="215" cy="235" r="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
  <circle cx="215" cy="235" r="3" fill="#EF4444"/>
  <line x1="215" y1="235" x2="223" y2="230" stroke="#EF4444" stroke-width="2"/>
  <text x="175" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369A1">WATER METER</text>

  <!-- House Foundation on Right -->
  <polygon points="620,130 710,70 800,130" fill="#991B1B"/>
  <rect x="630" y="130" width="160" height="110" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="660" y="150" width="35" height="35" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
  <rect x="730" y="150" width="35" height="35" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
  <rect x="685" y="185" width="40" height="55" fill="#475569"/>
  <!-- Foundation Slab -->
  <rect x="620" y="235" width="180" height="170" fill="#94A3B8"/>
  <text x="660" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">HOME SLAB /</text>
  <text x="660" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">FOUNDATION</text>

  <!-- Utility City Water Main (Under Street) -->
  <rect x="0" y="320" width="180" height="24" fill="#0284C7" rx="4"/>
  <text x="20" y="337" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">City Water Main</text>

  <!-- Utility Pipe to Meter -->
  <path d="M140 320 L140 250 L185 250" fill="none" stroke="#0284C7" stroke-width="12" stroke-linecap="round"/>

  <!-- Private Water Service Line (Meter to House) -->
  <path d="M245 250 L380 320 L640 320 L640 210" fill="none" stroke="#E11D48" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Leak Callout on Service Line -->
  <circle cx="440" cy="320" r="18" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M440 305 L445 320 L435 320 Z" fill="#38BDF8"/>
  <text x="375" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#DC2626">UNDERGROUND LEAK POINT</text>

  <!-- Main Shut-Off Valve at House Entrance -->
  <rect x="632" y="200" width="16" height="16" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <text x="590" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#D97706">Main Shut-Off</text>

  <!-- Zone 1 Boundary Label: Utility Responsibility -->
  <rect x="15" y="20" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="25" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369A1">UTILITY RESPONSIBILITY</text>
  <text x="25" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#475569">City Main &amp; Meter Box</text>
  <line x1="125" y1="80" x2="125" y2="190" stroke="#0284C7" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Zone 2 Boundary Label: Homeowner Responsibility -->
  <rect x="290" y="20" width="480" height="75" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="305" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#DC2626">HOMEOWNER / PROPERTY RESPONSIBILITY (PRIVATE LINE)</text>
  <text x="305" y="62" font-family="system-ui, sans-serif" font-size="11.5" fill="#7F1D1D">From meter outlet pipe to the house shut-off valve. Repairs &amp; replacements require a licensed contractor.</text>
  <line x1="245" y1="95" x2="245" y2="200" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="640" y1="95" x2="640" y2="190" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
