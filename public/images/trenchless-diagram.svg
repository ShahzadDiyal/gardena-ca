<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="auto" aria-label="Trenchless Water Line Replacement Technology Diagram">
  <defs>
    <linearGradient id="trenchSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#522504"/>
      <stop offset="100%" stop-color="#271101"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Ground & Driveway Surface -->
  <rect x="0" y="0" width="800" height="150" fill="#F8FAFC"/>
  <!-- Lawn section -->
  <rect x="0" y="140" width="220" height="240" fill="url(#trenchSoil)"/>
  <rect x="0" y="135" width="220" height="15" fill="url(#grass)"/>
  <!-- Preserved Driveway Concrete Section -->
  <rect x="220" y="135" width="360" height="25" fill="#94A3B8"/>
  <rect x="220" y="160" width="360" height="220" fill="url(#trenchSoil)"/>
  <text x="260" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F766E">PRESERVED CONCRETE DRIVEWAY &amp; LANDSCAPING (NO TRENCHING)</text>
  <line x1="220" y1="135" x2="580" y2="135" stroke="#0D9488" stroke-width="4"/>

  <!-- Right lawn section near house -->
  <rect x="580" y="140" width="220" height="240" fill="url(#trenchSoil)"/>
  <rect x="580" y="135" width="220" height="15" fill="url(#grass)"/>

  <!-- Access Pit 1 (Curb / Meter side) -->
  <rect x="120" y="140" width="80" height="150" fill="#E2E8F0" stroke="#0284C7" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="125" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369A1">ENTRY PIT (Small)</text>

  <!-- Access Pit 2 (House Foundation side) -->
  <rect x="600" y="140" width="80" height="150" fill="#E2E8F0" stroke="#0284C7" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="605" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369A1">EXIT PIT (Small)</text>

  <!-- Underground Pipe Pulling Cable -->
  <line x1="160" y1="240" x2="640" y2="240" stroke="#CBD5E1" stroke-width="20" stroke-linecap="round"/>
  <!-- New PEX-a / Copper Line Being Pulled Through -->
  <line x1="160" y1="240" x2="480" y2="240" stroke="#0284C7" stroke-width="16" stroke-linecap="round"/>
  <text x="280" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">NEW CONTINUOUS PIPE</text>

  <!-- Splitting / Bursting Head Tool -->
  <polygon points="480,225 515,240 480,255" fill="#EA580C"/>
  <circle cx="510" cy="240" r="4" fill="#FFFFFF"/>

  <!-- Pulling Cable tension -->
  <line x1="515" y1="240" x2="640" y2="240" stroke="#F59E0B" stroke-width="5" stroke-dasharray="6,3"/>

  <!-- Hydraulic Pulling Machine at Exit Pit -->
  <rect x="610" y="210" width="60" height="60" fill="#0F172A" rx="4"/>
  <text x="618" y="245" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#38BDF8">HYDRAULIC</text>
  <text x="625" y="258" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#38BDF8">PULLER</text>

  <!-- Callout Benefits -->
  <rect x="30" y="25" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F2C59">ZERO LAWN DESTRUCTION</text>
  <text x="40" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Only two minimal access points required.</text>

  <rect x="560" y="25" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="570" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F2C59">50+ YEAR LIFESPAN</text>
  <text x="570" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Seamless high-grade PEX-a or Type K Copper.</text>
</svg>
